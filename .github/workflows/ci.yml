# Pruebas en los tres sistemas operativos que qcorre soporta.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lo llama release.yml antes de publicar.
  workflow_call:

# Si llega un commit nuevo a la misma rama, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
        include:
          # Las versiones intermedias, solo en Linux (es la corrida más rápida).
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar qcorre y las herramientas de desarrollo
        run: python -m pip install -e ".[dev]"
      - name: Estilo
        run: ruff check .
      - name: Tests
        run: pytest

  paquete:
    name: Paquete instalable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construir el paquete
        run: |
          python -m pip install build
          python -m build
      - name: Instalar el paquete construido en un entorno limpio
        run: |
          python -m venv /tmp/limpio
          /tmp/limpio/bin/pip install dist/*.whl
          /tmp/limpio/bin/qcorre --version
          # La hoja de estilos debe viajar dentro del paquete.
          /tmp/limpio/bin/python -c "import qcorre.ui.app, importlib.resources as r; assert (r.files('qcorre.ui') / 'theme.tcss').is_file()"
