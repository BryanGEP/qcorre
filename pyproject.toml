[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qcorre"
dynamic = ["version"]
description = "¿Qué corre en tu compu? Panel del desarrollador en la terminal: procesos por proyecto y git en lenguaje humano."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bryan Gael Esquivel Pérez" }]
keywords = ["tui", "textual", "git", "procesos", "processes", "ports", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "textual>=8.0,<9",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]

[project.urls]
Repositorio = "https://github.com/BryanGEP/qcorre"
Incidencias = "https://github.com/BryanGEP/qcorre/issues"
Cambios = "https://github.com/BryanGEP/qcorre/blob/main/CHANGELOG.md"

[project.scripts]
qcorre = "qcorre.cli:main"

[tool.hatch.version]
path = "src/qcorre/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qcorre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Errores, imports ordenados, modernizaciones seguras y fallos comunes.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["qcorre"]

[tool.ruff.lint.per-file-ignores]
# En los tests se toleran líneas largas (dibujos esperados) y el orden de los
# imports entre módulos de test, que comparten utilidades.
"tests/*" = ["E501", "I001", "B905"]
# Tablas de textos y de datos de ejemplo: una línea por entrada se lee mejor.
"src/qcorre/i18n/*.py" = ["E501"]
"src/qcorre/demo.py" = ["E501"]
