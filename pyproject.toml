[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "qcorre"
dynamic = ["version", "readme"]
description = "See what's running on your machine, grouped by project, and use git in plain language. A terminal dashboard for developers."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bryan Gael Esquivel Pérez" }]
keywords = ["tui", "textual", "git", "procesos", "processes", "ports", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "textual>=8.0,<9",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
]

# Nombres que PyPI reconoce y muestra con su icono.
[project.urls]
Homepage = "https://github.com/BryanGEP/qcorre"
Source = "https://github.com/BryanGEP/qcorre"
Issues = "https://github.com/BryanGEP/qcorre/issues"
Changelog = "https://github.com/BryanGEP/qcorre/blob/main/CHANGELOG.md"

[project.scripts]
qcorre = "qcorre.cli:main"

[tool.hatch.version]
path = "src/qcorre/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qcorre"]

# ── Descripción para PyPI ───────────────────────────────────────
# Es el README.md tal cual, con un cambio: en GitHub las imágenes y los enlaces
# a otros archivos del repo son rutas relativas (docs/demo.gif, LICENSE...),
# que en la página de PyPI no llevarían a ningún lado. Al construir el paquete
# se convierten en URLs absolutas fijadas al tag de la versión (v0.1.0...), así
# la página de cada versión en PyPI muestra siempre sus propias imágenes.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Imágenes del repo: src="docs/..." -> archivo crudo en GitHub.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/BryanGEP/qcorre/v$HFPR_VERSION/\1"'

# Enlaces HTML a archivos del repo: href="LICENSE" -> página del archivo en GitHub.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/BryanGEP/qcorre/blob/v$HFPR_VERSION/\1"'

# Enlaces Markdown a archivos del repo: [texto](CHANGELOG.md) -> lo mismo.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/BryanGEP/qcorre/blob/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.sdist]
# El GIF, las capturas y el guion que los graba son para el repo, no para el paquete.
exclude = ["/docs", "/scripts", "/.github", "/.claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Errores, imports ordenados, modernizaciones seguras y fallos comunes.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["qcorre"]

[tool.ruff.lint.per-file-ignores]
# En los tests se toleran líneas largas (dibujos esperados) y el orden de los
# imports entre módulos de test, que comparten utilidades.
"tests/*" = ["E501", "I001", "B905"]
# Tablas de textos y de datos de ejemplo: una línea por entrada se lee mejor.
"src/qcorre/i18n/*.py" = ["E501"]
"src/qcorre/demo.py" = ["E501"]
